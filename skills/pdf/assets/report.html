<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>报告标题</title>
<style>
:root { --accent: #8a3a2a; --accent-light: #f5ece7; --cover-bg: #30231f; --cover-text: #faf5ef; }
</style></head>
<body>
<!-- 本文件是结构示例：根据实际内容替换文字，按需要保留封面、目录和章节。默认排版 CSS 由固定脚本注入。 -->
<section class="cover cover-fullbleed">
  <p class="eyebrow">报告类型 · 年份</p>
  <h1>报告标题</h1>
  <div class="accent-line"></div>
  <p class="subtitle">一句说明报告对象、范围和阅读目的的副标题。</p>
  <p class="metadata">作者或机构<br>发布日期</p>
</section>
<section>
  <h1 id="summary">核心结论</h1>
  <p class="lead">用可核对的证据说明主要结论，并区分事实与判断。</p>
  <h2 id="evidence">数据与依据</h2>
  <table><thead><tr><th>指标</th><th>观察</th><th>来源</th></tr></thead>
  <tbody><tr><td>示例指标</td><td>替换为真实数据或明确标注的示例</td><td>填写可验证来源</td></tr></tbody></table>
  <div class="callout"><strong>适用范围</strong><p>说明时间范围、样本、计算口径与不确定性。</p></div>
  <h2 id="actions">建议与下一步</h2>
  <p>建议应能追溯到证据；需要决策的事项写清楚条件与影响。</p>
</section>
</body></html>
